<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage V2 — Task-centric</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f0;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #999999;
    --border-tertiary: rgba(0,0,0,0.1);
    --border-secondary: rgba(0,0,0,0.2);
    --bg-info: #E6F1FB;
    --text-info: #0C447C;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-secondary); color: var(--text-primary); }
  .app { max-width: 960px; margin: 40px auto; background: var(--bg-primary); border-radius: var(--radius-lg); border: 1px solid var(--border-tertiary); overflow: hidden; min-height: 600px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border-tertiary); }
  .topbar-logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-info); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: var(--text-info); }
  .center { max-width: 520px; margin: 0 auto; padding: 40px 24px; }
  h1 { font-size: 22px; font-weight: 600; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 14px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
  .chat-box { border: 1px solid var(--border-secondary); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 14px; }
  .agent-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 100px; font-size: 13px; cursor: pointer; margin-bottom: 10px; transition: opacity 0.15s; }
  .agent-badge:hover { opacity: 0.8; }
  .chat-input { width: 100%; border: none; outline: none; font-size: 14px; min-height: 36px; resize: none; font-family: inherit; color: var(--text-primary); background: transparent; }
  .chat-input::placeholder { color: var(--text-tertiary); }
  .chat-bottom { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
  .send-btn { width: 32px; height: 32px; border-radius: 50%; background: var(--text-primary); color: var(--bg-primary); border: none; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px; }
  .quick-btn { padding: 7px 14px; border-radius: 100px; border: 1px solid var(--border-tertiary); font-size: 13px; color: var(--text-secondary); cursor: pointer; background: none; transition: background 0.15s; font-family: inherit; }
  .quick-btn:hover { background: var(--bg-secondary); }
  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .section-header h3 { font-size: 15px; font-weight: 600; }
  .section-header a { font-size: 13px; color: var(--text-info); text-decoration: none; cursor: pointer; }
  .ws-item { padding: 14px; border: 1px solid var(--border-tertiary); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s; }
  .ws-item:hover { background: var(--bg-secondary); }
  .ws-icon { width: 34px; height: 34px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
  .dropdown { display: none; position: absolute; z-index: 10; background: var(--bg-primary); border: 1px solid var(--border-tertiary); border-radius: var(--radius-md); padding: 4px; width: 220px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
  .dropdown-item { padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 10px; font-size: 13px; transition: background 0.15s; }
  .dropdown-item:hover { background: var(--bg-secondary); }
  .dd-icon { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">🤖 AgentSpace</div>
    <div style="display:flex; align-items:center; gap:14px;">
      <span style="color:var(--text-secondary); cursor:pointer;">🔔</span>
      <div class="avatar">U</div>
    </div>
  </div>
  <div class="center">
    <h1>What are you working on?</h1>
    <p class="subtitle">Describe your task and let an agent help, or jump into a workspace.</p>

    <div class="chat-box">
      <div style="position: relative; display: inline-block;">
        <div class="agent-badge" id="agent-badge" onclick="toggleDropdown()" style="background:#EEEDFE; color:#3C3489;">
          <span id="badge-icon">📊</span>
          <span id="badge-name">Research analyst</span>
          <span>▾</span>
        </div>
        <div class="dropdown" id="dropdown"></div>
      </div>
      <textarea class="chat-input" placeholder="Describe what you need help with..." rows="2"></textarea>
      <div class="chat-bottom">
        <div style="display:flex; gap:10px; color:var(--text-tertiary); font-size:16px;">
          <span style="cursor:pointer;">📎</span>
          <span style="cursor:pointer;">🖼️</span>
        </div>
        <button class="send-btn">↑</button>
      </div>
    </div>

    <div class="quick-actions">
      <button class="quick-btn">✏️ Write a blog post</button>
      <button class="quick-btn">💻 Debug my code</button>
      <button class="quick-btn">📊 Analyze data</button>
    </div>

    <div class="section-header">
      <h3>Recent workspaces</h3>
      <a>View all</a>
    </div>
    <div id="ws-list"></div>
  </div>
</div>
<script>
const agents = [
  { id:'research', name:'Research analyst', icon:'📊', bg:'#EEEDFE', text:'#3C3489' },
  { id:'writer', name:'Content writer', icon:'✏️', bg:'#E1F5EE', text:'#085041' },
  { id:'code', name:'Code assistant', icon:'💻', bg:'#E6F1FB', text:'#0C447C' },
  { id:'design', name:'Design copilot', icon:'🎨', bg:'#FAECE7', text:'#712B13' },
  { id:'data', name:'Data engineer', icon:'🗄️', bg:'#FAEEDA', text:'#633806' },
  { id:'pm', name:'Product manager', icon:'📋', bg:'#FBEAF0', text:'#72243E' }
];

const workspaces = [
  { name:'Market report Q2', agent:'Research analyst', icon:'📊', bg:'#EEEDFE', updated:'2 hours ago' },
  { name:'Blog draft — AI trends', agent:'Content writer', icon:'✏️', bg:'#E1F5EE', updated:'5 hours ago' },
  { name:'API refactor', agent:'Code assistant', icon:'💻', bg:'#E6F1FB', updated:'Yesterday' },
  { name:'Homepage redesign', agent:'Design copilot', icon:'🎨', bg:'#FAECE7', updated:'2 days ago' }
];

document.getElementById('ws-list').innerHTML = workspaces.map(w =>
  `<div class="ws-item">
    <div style="display:flex; align-items:center; gap:12px;">
      <div class="ws-icon" style="background:${w.bg}">${w.icon}</div>
      <div><p style="font-weight:600; font-size:14px; margin:0;">${w.name}</p><p style="font-size:12px; color:var(--text-tertiary); margin:2px 0 0;">${w.agent} · ${w.updated}</p></div>
    </div>
    <span style="color:var(--text-tertiary)">›</span>
  </div>`
).join('');

let open = false;
function toggleDropdown() {
  open = !open;
  const dd = document.getElementById('dropdown');
  if (open) {
    dd.style.display = 'block';
    dd.innerHTML = agents.map(a =>
      `<div class="dropdown-item" onclick="pickAgent('${a.id}')">
        <div class="dd-icon" style="background:${a.bg}">${a.icon}</div>
        ${a.name}
      </div>`
    ).join('');
  } else { dd.style.display = 'none'; }
}

function pickAgent(id) {
  const a = agents.find(x => x.id === id);
  const badge = document.getElementById('agent-badge');
  badge.style.background = a.bg;
  badge.style.color = a.text;
  document.getElementById('badge-icon').textContent = a.icon;
  document.getElementById('badge-name').textContent = a.name;
  open = false;
  document.getElementById('dropdown').style.display = 'none';
}
</script>
</body>
</html>
