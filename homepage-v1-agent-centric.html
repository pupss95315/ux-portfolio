<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homepage V1 — Agent-centric</title>
<style>
  :root {
    --bg-primary: #ffffff;
    --bg-secondary: #f5f5f0;
    --bg-tertiary: #eeeee8;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b6b;
    --text-tertiary: #999999;
    --border-tertiary: rgba(0,0,0,0.1);
    --border-secondary: rgba(0,0,0,0.2);
    --border-info: #185FA5;
    --bg-info: #E6F1FB;
    --text-info: #0C447C;
    --radius-md: 8px;
    --radius-lg: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg-secondary); color: var(--text-primary); }
  .app { max-width: 960px; margin: 40px auto; background: var(--bg-primary); border-radius: var(--radius-lg); border: 1px solid var(--border-tertiary); overflow: hidden; min-height: 600px; display: flex; flex-direction: column; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid var(--border-tertiary); }
  .topbar-logo { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 16px; }
  .topbar-actions { display: flex; align-items: center; gap: 16px; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--bg-info); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; color: var(--text-info); }
  .body { flex: 1; display: flex; }
  .sidebar { width: 220px; border-right: 1px solid var(--border-tertiary); padding: 16px 12px; }
  .sidebar-label { font-size: 11px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.5px; margin: 0 0 12px 8px; }
  .sidebar-item { padding: 8px 10px; border-radius: var(--radius-md); cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; transition: background 0.15s; }
  .sidebar-item:hover { background: var(--bg-secondary); }
  .sidebar-item .icon-circle { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .sidebar-item span { font-size: 13px; }
  .main { flex: 1; padding: 28px; overflow-y: auto; }
  .main h2 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .main .subtitle { font-size: 14px; color: var(--text-secondary); margin: 0 0 24px; }
  .agent-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .agent-card { background: var(--bg-primary); border: 1px solid var(--border-tertiary); border-radius: var(--radius-lg); padding: 20px; cursor: pointer; transition: border-color 0.15s, transform 0.1s; }
  .agent-card:hover { border-color: var(--border-secondary); transform: translateY(-1px); }
  .agent-card .card-icon { width: 44px; height: 44px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; font-size: 22px; }
  .agent-card h3 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .agent-card p { font-size: 13px; color: var(--text-secondary); margin: 0; line-height: 1.4; }
  .detail-header { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; }
  .back-btn { cursor: pointer; width: 32px; height: 32px; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; transition: background 0.15s; border: none; background: none; font-size: 18px; color: var(--text-secondary); }
  .back-btn:hover { background: var(--bg-secondary); }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 28px; }
  .action-card { background: var(--bg-primary); border: 1px solid var(--border-tertiary); border-radius: var(--radius-lg); padding: 24px; cursor: pointer; text-align: center; transition: border-color 0.15s; }
  .action-card:hover { border-color: var(--border-info); }
  .action-card .action-icon { font-size: 32px; color: var(--text-info); margin-bottom: 10px; }
  .action-card h4 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .action-card p { font-size: 13px; color: var(--text-secondary); margin: 0; }
  .ws-item { padding: 12px 14px; border: 1px solid var(--border-tertiary); border-radius: var(--radius-md); margin-bottom: 8px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.15s; }
  .ws-item:hover { background: var(--bg-secondary); }
  .ws-item-left { display: flex; align-items: center; gap: 10px; }
  .ws-item-left span { font-size: 14px; }
  #detail-view { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="topbar-logo">🤖 AgentSpace</div>
    <div class="topbar-actions">
      <span style="color: var(--text-secondary); cursor: pointer;">🔔</span>
      <span style="color: var(--text-secondary); cursor: pointer;">⚙️</span>
      <div class="avatar">U</div>
    </div>
  </div>
  <div class="body">
    <div class="sidebar">
      <p class="sidebar-label">My agents</p>
      <div id="sidebar-list"></div>
      <div style="margin-top: 16px; border-top: 1px solid var(--border-tertiary); padding-top: 16px;">
        <p class="sidebar-label">Marketplace</p>
        <div class="sidebar-item" style="color: var(--text-secondary); font-size: 13px;">+ Browse agents</div>
      </div>
    </div>
    <div class="main">
      <div id="grid-view">
        <h2>Choose an agent</h2>
        <p class="subtitle">Select an agent to start a conversation or open a workspace.</p>
        <div class="agent-grid" id="agent-grid"></div>
      </div>
      <div id="detail-view"></div>
    </div>
  </div>
</div>
<script>
const agents = [
  { id:'research', name:'Research analyst', icon:'📊', color:'#EEEDFE', textColor:'#3C3489', desc:'Deep research and data analysis', workspaces:['Market report Q2','Competitor analysis'] },
  { id:'writer', name:'Content writer', icon:'✏️', color:'#E1F5EE', textColor:'#085041', desc:'Blog posts, copy, and documents', workspaces:['Blog draft — AI trends','Product launch copy'] },
  { id:'code', name:'Code assistant', icon:'💻', color:'#E6F1FB', textColor:'#0C447C', desc:'Write, review, and debug code', workspaces:['API refactor','Bug triage'] },
  { id:'design', name:'Design copilot', icon:'🎨', color:'#FAECE7', textColor:'#712B13', desc:'UI feedback and design systems', workspaces:['Homepage redesign'] },
  { id:'data', name:'Data engineer', icon:'🗄️', color:'#FAEEDA', textColor:'#633806', desc:'Pipelines, SQL, and dashboards', workspaces:['ETL pipeline v2'] },
  { id:'pm', name:'Product manager', icon:'📋', color:'#FBEAF0', textColor:'#72243E', desc:'Specs, roadmaps, and prioritization', workspaces:['Q3 roadmap','Feature spec — search'] }
];

function renderSidebar() {
  document.getElementById('sidebar-list').innerHTML = agents.map(a =>
    `<div class="sidebar-item" onclick="selectAgent('${a.id}')">
      <div class="icon-circle" style="background:${a.color}">${a.icon}</div>
      <span>${a.name}</span>
    </div>`
  ).join('');
}

function renderGrid() {
  document.getElementById('agent-grid').innerHTML = agents.map(a =>
    `<div class="agent-card" onclick="selectAgent('${a.id}')">
      <div class="card-icon" style="background:${a.color}">${a.icon}</div>
      <h3>${a.name}</h3>
      <p>${a.desc}</p>
    </div>`
  ).join('');
}

function selectAgent(id) {
  const a = agents.find(x => x.id === id);
  document.getElementById('grid-view').style.display = 'none';
  const detail = document.getElementById('detail-view');
  detail.style.display = 'block';
  detail.innerHTML = `
    <div class="detail-header">
      <button class="back-btn" onclick="backToGrid()">←</button>
      <div class="icon-circle" style="background:${a.color}; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:20px;">${a.icon}</div>
      <div><h2 style="font-size:18px; margin:0;">${a.name}</h2><p style="font-size:13px; color:var(--text-secondary); margin:0;">${a.desc}</p></div>
    </div>
    <div class="action-grid">
      <div class="action-card"><div class="action-icon">💬</div><h4>New chat</h4><p>Start a conversation</p></div>
      <div class="action-card"><div class="action-icon">📁</div><h4>New workspace</h4><p>Create a project space</p></div>
    </div>
    <p style="font-size:14px; font-weight:600; color:var(--text-secondary); margin:0 0 12px;">Recent workspaces</p>
    ${a.workspaces.map(w => `<div class="ws-item"><div class="ws-item-left"><span>📂</span><span>${w}</span></div><span style="color:var(--text-tertiary)">›</span></div>`).join('')}
  `;
}

function backToGrid() {
  document.getElementById('detail-view').style.display = 'none';
  document.getElementById('grid-view').style.display = 'block';
}

renderSidebar();
renderGrid();
</script>
</body>
</html>
